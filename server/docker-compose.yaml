name: ntust-notify

services:
  backend:
    container_name: ntust-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service-account.json
    volumes:
      # Mounted read-only, outside the app directory.
      - ./service-account.json:/run/secrets/service-account.json:ro
    ports:
      # Loopback by default: the API is reachable only through a reverse
      # proxy / tunnel on this host, so direct clients can't spoof
      # X-Forwarded-For. Set BIND_ADDR=0.0.0.0 only if clients must connect
      # directly (and then set TRUST_PROXY=0).
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
